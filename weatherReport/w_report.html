<!DOCTYPE html>
<html>
<head>
  <title>Weather Today</title>
</head>
<body>
    
  <h1>Weather Report</h1>

  <form id="weatherForm">
    <label for="latitude">Enter Latitude:</label>
    <input type="number" id="latitude" name="Lat" step="any">

    <label for="longitude">Enter Longitude:</label>
    <input type="number" id="longitude" name="Lon" step="any">

    <button type="submit">Submit</button>
  </form>

  <div id="weatherInfo"></div>
  <script src="./config.js"></script>
  <script src="./w_report.js"></script>
</body>

</html>
